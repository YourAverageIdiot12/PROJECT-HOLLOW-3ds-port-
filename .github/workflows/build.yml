name: Build 3DS
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS libraries and helpers
        run: |
          for i in 1 2 3 4 5 6; do
            dkp-pacman -Syu --noconfirm 3ds-dev && break
            echo "devkitPro server refused, retry $i in 30s"
            sleep 30
          done
          dkp-pacman -Q libctru citro2d citro3d
          apt-get update
          apt-get install -y python3

      - name: Create placeholder icon, banner and banner audio (skipped if you add your own in assets/)
        run: |
          mkdir -p assets
          python3 - <<'PY'
          import struct,zlib,wave,os
          def png(path,w,h,fn):
              raw=b''.join(b'\x00'+b''.join(bytes(fn(x,y))+b'\xff' for x in range(w)) for y in range(h))
              def ch(t,d):
                  c=struct.pack('>I',len(d))+t+d
                  return c+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              open(path,'wb').write(b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b''))
          def banner(x,y):
              v=int(14+8*y/128)
              if 96<x<160 and 30<y<98: return (176,24,24) if (x-128)**2+(y-60)**2<900 else (20,20,24)
              return (v,v,v+6)
          def icon(x,y):
              return (176,24,24) if (x-24)**2+(y-24)**2<300 else (14,14,20)
          if not os.path.exists('assets/banner.png'): png('assets/banner.png',256,128,banner)
          if not os.path.exists('assets/icon.png'): png('assets/icon.png',48,48,icon)
          if not os.path.exists('assets/audio.wav'):
              w=wave.open('assets/audio.wav','wb');w.setnchannels(2);w.setsampwidth(2);w.setframerate(32728)
              w.writeframes(b'\x00\x00\x00\x00'*32728*2);w.close()
          PY

      - name: Build .3dsx
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: built
          path: |
            project_hollow.elf
            project_hollow.3dsx
            cia.rsf
            assets/icon.png
            assets/banner.png
            assets/audio.wav

  cia:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built
          path: .

      - name: Download makerom and bannertool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          pick() { python3 -c "import sys,json;a=json.load(sys.stdin)['assets'];print(next(x['browser_download_url'] for x in a if $1))"; }
          MK=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/3DSGuy/Project_CTR/releases/latest | pick "'ubuntu' in x['name'].lower() and 'x86_64' in x['name'].lower()")
          curl -fsSL -o mk.zip "$MK" && unzip -o mk.zip -d mk
          sudo cp "$(find mk -name makerom -type f | head -1)" /usr/local/bin/makerom
          curl -fsSL -o bt.zip https://github.com/diasurgical/bannertool/releases/download/v1.2.0/bannertool.zip || curl -fsSL -o bt.zip "$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/diasurgical/bannertool/releases/latest | pick "x['name'].endswith('.zip')")"
          unzip -o bt.zip -d bt
          sudo cp "$(find bt -path '*linux*' -name bannertool -type f | head -1)" /usr/local/bin/bannertool
          sudo chmod +x /usr/local/bin/makerom /usr/local/bin/bannertool

      - name: Build .cia
        run: |
          mkdir -p build
          bannertool makebanner -i assets/banner.png -a assets/audio.wav -o build/banner.bnr
          bannertool makesmdh -s "Project Hollow" -l "Forsaken-like 3D survival game" -p "Hollow Dev" -i assets/icon.png -o build/icon.icn
          makerom -f cia -o project_hollow.cia -elf project_hollow.elf -rsf cia.rsf -icon build/icon.icn -banner build/banner.bnr -exefslogo -target t
          ls -l project_hollow.cia

      - uses: actions/upload-artifact@v4
        with:
          name: project-hollow-3ds
          path: |
            project_hollow.3dsx
            project_hollow.cia

      - name: Publish release (gives you a direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Project Hollow (latest build)
          files: |
            project_hollow.3dsx
            project_hollow.cia
